<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Launch</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <main class="landing-page">

        <section class="hero">

            <p class="eyebrow">
                Coming Soon
            </p>

            <h1>Something Great Is Launching</h1>

            <p>
                Join us for the launch of our new product.
            </p>


            <div
                class="countdown"
                data-target="2026-12-31T16:00:00Z"
                aria-label="Countdown to product launch"
            >

                <div>
                    <span id="days">00</span>
                    <span>Days</span>
                </div>

                <div>
                    <span id="hours">00</span>
                    <span>Hours</span>
                </div>

                <div>
                    <span id="minutes">00</span>
                    <span>Minutes</span>
                </div>

                <div>
                    <span id="seconds">00</span>
                    <span>Seconds</span>
                </div>

            </div>

        </section>

    </main>
    <script src="js/countdown.js" defer></script>
</body>

</html>
